workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      # Sem bloco `ios_signing` aqui de propósito: ele dispara uma checagem
      # automática de assinatura ANTES de qualquer script rodar, e essa
      # checagem só sabe usar perfil já existente — como é o primeiro app
      # iOS, não existia nenhum, e isso falhava antes do meu passo "Set up
      # code signing" (que sabe criar) ter chance de rodar. Toda a
      # assinatura fica só por conta do script abaixo.
      vars:
        BUNDLE_ID: "br.com.lfsystem.app.Motorista"
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # define TEAM_ID nesse grupo, nas variáveis de ambiente do Codemagic
    scripts:
      - name: Set up environment
        script: |
          chmod +x gradlew

      - name: Install Pods
        script: |
          cd iosApp
          pod install

      - name: Set up code signing (cria certificado + perfil de distribuição se ainda não existirem)
        script: |
          # Primeiro app iOS publicado por aqui — ainda não existe certificado
          # nem provisioning profile de distribuição. `use-profiles` sozinho só
          # ENCONTRA perfil já existente (por isso dava "No matching profiles
          # found"); `fetch-signing-files --create` cria o que faltar (cert +
          # perfil), e só depois `use-profiles` aplica isso ao projeto Xcode.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create

          xcode-project use-profiles

      - name: Incrementa o número de build automaticamente (evita "build já usado")
        script: |
          cd iosApp
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Archive (Release, assinado)
        script: |
          cd iosApp

          xcodebuild -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $(PWD)/build/iosApp.xcarchive \
            OTHER_LDFLAGS='$(inherited) -lsqlite3' \
            LIBRARY_SEARCH_PATHS='$(inherited) /usr/lib' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Exporta o .ipa assinado pra App Store
        script: |
          cd iosApp

          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          mkdir -p $HOME/builds/output

          xcodebuild -exportArchive \
            -archivePath $(PWD)/build/iosApp.xcarchive \
            -exportPath $HOME/builds/output \
            -exportOptionsPlist ExportOptions.plist

          echo "🎉 IPA exportado:"
          ls -lh $HOME/builds/output/*.ipa

    artifacts:
      - $HOME/builds/output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Deixe false até validar algumas builds no TestFlight. Quando quiser
        # que o Codemagic já mande pra revisão da Apple automaticamente,
        # troque pra true.
        submit_to_app_store: false
      email:
        recipients:
          - lucas.felipe68@gmail.com
