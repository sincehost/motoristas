workflows:
  ios-workflow:
    name: iOS Workflow
    # Build ficava preso em "queued" com mac_mini_m2 (fila por falta de
    # maquina M2 livre no plano). O dropdown "Instance type" no Codemagic
    # mostrou Mac mini M4 como a maquina disponivel nesse plano — trocado
    # pra essa.
    instance_type: mac_mini_m4
    max_build_duration: 60
    integrations:
      app_store_connect: Codmagic novo
    environment:
      # ios_signing de volta: antes falhava porque não existia NENHUM
      # certificado em Code signing identities (conferido na tela — "No
      # certificates shared with the team") e a integração Developer
      # Portal estava desconectada. Os dois já foram corrigidos (certificado
      # "trakvia-ios-distribution" criado, integração "Codmagic novo"
      # conectada), então esse bloco agora tem o que precisa pra funcionar.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.lfsystem.app.Motorista
      vars:
        BUNDLE_ID: "br.com.lfsystem.app.Motorista"
        # Team ID fixo aqui porque a conta pessoal do Codemagic nao deixa
        # criar grupo nem variavel global (ambos bloqueados na UI). Nao e
        # segredo — e so um identificador, nao da acesso a nada sozinho.
        TEAM_ID: "5PC89KBGRN"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up environment
        script: |
          chmod +x gradlew

      - name: Install Pods
        script: |
          cd iosApp
          pod install

      - name: Set up code signing (usa certificado + perfil já cadastrados no Codemagic)
        script: |
          # Certificado ("trakvia-ios-distribution") e provisioning profile
          # ("Trakvia App Store") foram gerados manualmente em Code signing
          # identities (Team settings), já com a chave privada guardada
          # corretamente pelo próprio Codemagic — evita o problema de tentar
          # criar tudo via linha de comando numa VM efêmera, que não conseguia
          # persistir a chave privada entre os passos ("Cannot save Signing
          # Certificates without certificate private key").
          xcode-project use-profiles --verbose

      - name: Archive (Release, assinado)
        script: |
          cd iosApp

          echo "===== DIAGNÓSTICO: build settings de assinatura (Release) ====="
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp -configuration Release -showBuildSettings 2>&1 \
            | grep -i "CODE_SIGN\|PROVISIONING_PROFILE\|DEVELOPMENT_TEAM\|PRODUCT_BUNDLE_IDENTIFIER\|CURRENT_PROJECT_VERSION" || true
          echo "================================================================="

          # Assinatura manual com nome de perfil exato ("Trakvia App Store")
          # ficou frágil demais: dependia do perfil na Apple estar vinculado
          # ao certificado certo, e toda vez que um dos dois era recriado os
          # dois saiam de sincronia ("No profile for team... found"). Com o
          # ios_signing + integração conectada, -allowProvisioningUpdates
          # deixa o Xcode buscar/criar o perfil certo sozinho via API, sem
          # depender de nome batendo em três lugares diferentes.
          #
          # CURRENT_PROJECT_VERSION continua forçado aqui pelo mesmo motivo:
          # Config.xcconfig tem CURRENT_PROJECT_VERSION=1 fixo, e o projeto não
          # está configurado com VERSIONING_SYSTEM=apple-generic — então
          # `agvtool new-version` (tentado antes, em passos separados) não tinha
          # efeito nenhum, e todo build ia sempre com versão "1", colidindo
          # com o build já enviado (ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE).
          # Passar na linha de comando tem prioridade sobre o xcconfig e
          # garante um valor sempre maior que qualquer build anterior.
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "Build number desta vez: $BUILD_NUMBER"

          xcodebuild -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $(PWD)/build/iosApp.xcarchive \
            -allowProvisioningUpdates \
            OTHER_LDFLAGS='$(inherited) -lsqlite3' \
            LIBRARY_SEARCH_PATHS='$(inherited) /usr/lib' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Exporta o .ipa assinado pra App Store
        script: |
          cd iosApp

          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          mkdir -p $HOME/builds/output

          xcodebuild -exportArchive \
            -archivePath $(PWD)/build/iosApp.xcarchive \
            -exportPath $HOME/builds/output \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

          echo "🎉 IPA exportado:"
          ls -lh $HOME/builds/output/*.ipa

    artifacts:
      - $HOME/builds/output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # "beta_groups" com o grupo interno dava erro ("Cannot add internal
        # group to a build" — grupos internos não aceitam atribuição
        # explícita de build via essa API). Removido: com todos os campos de
        # Test Information preenchidos (Beta App Review Information + Beta
        # App Description), o envio padrão deve passar sem precisar de
        # revisão de verdade (só tem testers internos).
        # Deixe false até validar algumas builds no TestFlight. Quando quiser
        # que o Codemagic já mande pra revisão da Apple automaticamente,
        # troque pra true.
        submit_to_app_store: false
      email:
        recipients:
          - lucas.felipe68@gmail.com
