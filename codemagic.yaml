workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codmagic01
    environment:
      # Certificado ("trakvia-ios-distribution") e perfil ("Trakvia App
      # Store") já existem em Code signing identities (Team settings) —
      # esse bloco é o que puxa os dois pro ambiente do build ANTES dos
      # scripts rodarem. Antes disso dava erro porque nada existia ainda
      # pra encontrar; agora que existem, deve casar certinho.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.lfsystem.app.Motorista
      vars:
        BUNDLE_ID: "br.com.lfsystem.app.Motorista"
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # define TEAM_ID nesse grupo, nas variáveis de ambiente do Codemagic
    scripts:
      - name: Set up environment
        script: |
          chmod +x gradlew

      - name: Install Pods
        script: |
          cd iosApp
          pod install

      - name: Set up code signing (usa certificado + perfil já cadastrados no Codemagic)
        script: |
          # Certificado ("trakvia-ios-distribution") e provisioning profile
          # ("Trakvia App Store") foram gerados manualmente em Code signing
          # identities (Team settings), já com a chave privada guardada
          # corretamente pelo próprio Codemagic — evita o problema de tentar
          # criar tudo via linha de comando numa VM efêmera, que não conseguia
          # persistir a chave privada entre os passos ("Cannot save Signing
          # Certificates without certificate private key").
          xcode-project use-profiles --verbose

      - name: Incrementa o número de build automaticamente (evita "build já usado")
        script: |
          cd iosApp
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Archive (Release, assinado)
        script: |
          cd iosApp

          echo "===== DIAGNÓSTICO: build settings de assinatura (Release) ====="
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp -configuration Release -showBuildSettings 2>&1 \
            | grep -i "CODE_SIGN\|PROVISIONING_PROFILE\|DEVELOPMENT_TEAM\|PRODUCT_BUNDLE_IDENTIFIER" || true
          echo "================================================================="

          # DEVELOPMENT_TEAM continua explícito aqui porque Config.xcconfig
          # deixa TEAM_ID vazio de propósito no repositório (só é preenchido
          # via essa variável de ambiente do build). CODE_SIGN_STYLE NÃO
          # entra mais: o passo "Set up code signing" (xcode-project
          # use-profiles) já configurou o projeto com Manual + o perfil de
          # distribuição específico — sobrescrever pra Automatic fazia o
          # Xcode ignorar isso e procurar (sem sucesso) um perfil de
          # Development sozinho.
          xcodebuild -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $(PWD)/build/iosApp.xcarchive \
            OTHER_LDFLAGS='$(inherited) -lsqlite3' \
            LIBRARY_SEARCH_PATHS='$(inherited) /usr/lib' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Exporta o .ipa assinado pra App Store
        script: |
          cd iosApp

          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          mkdir -p $HOME/builds/output

          xcodebuild -exportArchive \
            -archivePath $(PWD)/build/iosApp.xcarchive \
            -exportPath $HOME/builds/output \
            -exportOptionsPlist ExportOptions.plist

          echo "🎉 IPA exportado:"
          ls -lh $HOME/builds/output/*.ipa

    artifacts:
      - $HOME/builds/output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Deixe false até validar algumas builds no TestFlight. Quando quiser
        # que o Codemagic já mande pra revisão da Apple automaticamente,
        # troque pra true.
        submit_to_app_store: false
      email:
        recipients:
          - lucas.felipe68@gmail.com
