# Gradle com pouco heap de propósito: o trabalho pesado do iOS (link do
# framework Release) roda num processo java separado, com o heap de
# kotlin.native.jvmArgs lá embaixo. O Mac mini M2 do Codemagic tem 8 GB —
# a soma dos dois não pode passar disso, senão o macOS mata o processo (exit 137).
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

kotlin.code.style=official
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
# Desativa o daemon do compilador Kotlin/Native (não roda dentro do Gradle).
kotlin.native.disableCompilerDaemon=true
# Com o daemon desativado, o compilador Kotlin/Native roda num processo java
# separado ("Process 'command .../java' finished with non-zero exit value
# 137") que NÃO herda org.gradle.jvmargs — o heap dele vem daqui. Sem isso
# ficava no padrão do JVM (~2 GB) e o link do Release dava Java heap space.
kotlin.native.jvmArgs=-Xmx5g -XX:+UseParallelGC

android.useAndroidX=true
android.nonTransitiveRClass=true
