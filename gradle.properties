# 6 GB: com 5 GB o linkReleaseFrameworkIosArm64 ainda dava "Java heap space"
# no Mac mini M2 do Codemagic (8 GB de RAM). Não passar muito disso, senão o
# próprio macOS mata o processo (exit 137) por falta de memória na máquina.
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Dkotlin.daemon.jvm.options\="-Xmx6144M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

kotlin.code.style=official
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
# O link do framework iOS (linkReleaseFrameworkIosArm64) estourava
# OutOfMemoryError rodando dentro do próprio daemon do Gradle (não no
# daemon separado do Kotlin) — desativa esse daemon separado pra tudo
# rodar num processo só, com o heap de org.gradle.jvmargs acima,
# em vez de disputar memória entre dois processos JVM concorrentes.
kotlin.native.disableCompilerDaemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
