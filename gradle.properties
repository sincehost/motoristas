org.gradle.jvmargs=-Xmx5120M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx5120M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

kotlin.code.style=official
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
# O link do framework iOS (linkReleaseFrameworkIosArm64) estourava
# OutOfMemoryError rodando dentro do próprio daemon do Gradle (não no
# daemon separado do Kotlin) — desativa esse daemon separado pra tudo
# rodar num processo só, com o heap de org.gradle.jvmargs acima,
# em vez de disputar memória entre dois processos JVM concorrentes.
kotlin.native.disableCompilerDaemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
